spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:AjedrezSecretKeyQueDebeSerMuyLargaParaQueSeaSeguraConJWT1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Legacy aliases kept for compatibility with previous code/configuration.
bezkoder.app.jwtSecret=${app.jwt.secret}
bezkoder.app.jwtExpirationMs=${app.jwt.expiration-ms}
